plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pairing'
version = '0.0.1-SNAPSHOT'
description = 'pairing-admin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 / 검증 / 영속성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 인증 / 인가 (세션 로그인)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // S3 (백엔드와 같은 버킷을 공유한다)
    implementation 'software.amazon.awssdk:s3:2.25.11'

    // 헬스체크
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API 문서 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 테스트는 인메모리 DB로 돈다. 실제 RDS를 건드리지 않기 위해서다.
    // (스키마는 백엔드가 단일 소스라, 테스트에서만 엔티티로부터 생성한다)
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 소스에 한글 주석·문자열이 들어가므로 인코딩을 명시한다.
// Java 17은 플랫폼 기본 인코딩을 쓰기 때문에, 지정하지 않으면 개발자 OS 설정에 따라
// 다른 장비에서 컴파일할 때 한글이 깨질 수 있다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // 백엔드 프로젝트와 동일하게 JVM 타임존을 KST로 고정한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
    testLogging {
        exceptionFormat = 'full'
    }
}

// 배포 산출물 이름을 고정한다. (CI에서 app.jar 로 복사해 Dockerfile이 집어간다)
tasks.named('bootJar') {
    archiveFileName = 'pairing-admin.jar'
}

/**
 * 프로젝트 루트의 .env 를 읽어 Map 으로 돌려준다. 파일이 없으면 빈 Map.
 *
 * 스프링 부트는 .env 를 스스로 읽지 않는다. 쉘마다 주입 방법이 달라서
 * (bash 는 `set -a; source .env`, PowerShell 은 별도 스크립트) 매번 헷갈리므로
 * 빌드 스크립트가 대신 읽어 bootRun 의 환경변수로 넣어 준다.
 *
 * 지원 형식
 *   KEY=value          # 주석
 *   export KEY=value   (앞의 export 는 무시한다)
 *   KEY="value"        (감싼 따옴표는 벗겨 낸다)
 *
 * 값 안의 #은 주석으로 보지 않는다. 비밀번호에 #이 들어가는 경우가 흔하기 때문이다.
 */
def loadDotEnv() {
    def envFile = rootProject.file('.env')
    if (!envFile.exists()) {
        return [:]
    }

    def result = [:]
    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#')) {
            return
        }
        if (line.startsWith('export ')) {
            line = line.substring('export '.length()).trim()
        }

        def separator = line.indexOf('=')
        if (separator <= 0) {
            return
        }

        def key = line.substring(0, separator).trim()
        def value = line.substring(separator + 1).trim()

        if (value.length() >= 2
                && ((value.startsWith('"') && value.endsWith('"'))
                || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }

        result[key] = value
    }
    return result
}

tasks.named('bootRun') {
    // Java 17은 콘솔 출력에 OS 기본 인코딩(윈도우는 cp949)을 쓴다.
    // 지정하지 않으면 한글 로그가 깨져서 나온다. (배포 컨테이너는 UTF-8이라 문제없다)
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8',
            '-Duser.timezone=Asia/Seoul'
    ]

    // .env 값이 쉘 환경변수보다 우선한다.
    // Gradle 데몬은 한 번 뜨면 예전 실행의 환경변수를 그대로 들고 있어서,
    // 쉘 쪽을 우선하면 "예전에 한 번 넣었던 값"이 계속 이기는 일이 생긴다.
    // .env 파일이 눈에 보이는 단일 기준이 되도록 이쪽을 우선한다.
    def dotEnv = loadDotEnv()
    if (!dotEnv.isEmpty()) {
        logger.lifecycle("[bootRun] .env 에서 ${dotEnv.size()}개 환경변수를 읽었습니다: ${dotEnv.keySet().sort().join(', ')}")
        environment dotEnv
    }
}
