# 테스트 전용 설정. 실제 RDS를 건드리지 않도록 인메모리 H2를 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:pairing-admin;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      # 테스트는 H2에 ddl-auto=create-drop 으로 모든 테이블을 만든다.
      # schema-admin.sql 까지 돌면 admin_user 를 두 번 만들려 해서 충돌한다.
      mode: never

  jpa:
    hibernate:
      # 운영은 validate 지만, 테스트는 실제 스키마가 없으므로 엔티티로부터 만든다.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  security:
    # 테스트에서는 CSRF 토큰 왕복을 재현하지 않는다. 검증 대상은 "세션이 유지되는가" 이다.
    csrf-enabled: false
    login-fail-max: 5
  cors:
    allowed-origins: http://localhost:17001
  bootstrap:
    admin:
      enabled: false

cloud:
  aws:
    s3:
      bucket: test-bucket

logging:
  level:
    org.hibernate.SQL: warn
