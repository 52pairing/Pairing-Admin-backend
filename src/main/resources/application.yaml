spring:
  application:
    name: pairing-admin

  data:
    redis:
      # 백엔드(Pairing-backend)와 "같은" Redis 인스턴스를 바라본다.
      # 회원을 정지할 때 백엔드가 들고 있는 로그인 세션 키(RT:{id}, SESSION:{id})를 지워야
      # 이미 로그인된 사용자가 즉시 끊긴다. DB 상태만 바꾸면 액세스 토큰 수명(기본 30분)만큼 늦게 끊긴다.
      # DB URL 과 마찬가지로 배포 시 백엔드와 동일한 값을 주입해야 한다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # 로컬(평문 Docker Redis)은 false, 전송 중 암호화를 쓰는 관리형 Redis는 true
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      connect-timeout: 10000ms
      lettuce:
        shutdown-timeout: 200ms

  datasource:
    # 백엔드(Pairing-backend)와 "같은" RDS 인스턴스·같은 데이터베이스를 바라본다.
    # 값이 어긋나면 두 서버가 서로 다른 DB를 보게 되므로 배포 시 반드시 백엔드와 동일하게 주입한다.
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pairing}
    username: ${DB_USERNAME:pairing}
    password: ${DB_PASSWORD:pairing}
    hikari:
      # 관리자 서버는 동시 사용자가 적다. 백엔드와 같은 RDS를 공유하므로 커넥션을 적게 잡는다.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1

  sql:
    init:
      # 관리자 서버 전용 테이블(admin_user)만 만든다. IF NOT EXISTS 라 매번 실행해도 안전하다.
      # 이 스크립트는 DataSource 초기화 직후, JPA 검증(ddl-auto=validate) 이전에 실행된다.
      # 덕분에 첫 배포에서도 테이블이 없어서 기동이 실패하는 일이 없다.
      #
      # DB 계정에 CREATE 권한을 주고 싶지 않다면 db/init/05-create-admin-user-table.sql 을
      # 사람이 미리 실행하고 SQL_INIT_MODE=never 로 띄운다.
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema-admin.sql

  jpa:
    open-in-view: false
    hibernate:
      # 반드시 validate 로 둔다. 회원(account) 등 공유 테이블의 단일 소스는
      # 백엔드의 db/init/02-create-schema.sql 이며, 관리자 서버가 DDL을 건드리면
      # 두 서버가 스키마를 두고 경쟁하게 된다.
      # (엔티티와 테이블이 어긋나면 기동이 실패한다 — 그게 의도한 동작이다)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

server:
  # 백엔드(8080)와 다른 포트. 별도 EC2라도 로컬에서 함께 띄울 때 충돌하지 않게 8081을 쓴다.
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: native
  servlet:
    session:
      # 세션 만료 시간. 무활동 기준이며, 요청이 있을 때마다 갱신된다.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        # 백엔드와 같은 도메인을 쓰더라도 쿠키가 섞이지 않도록 이름을 분리한다.
        name: ADMIN_SESSION
        http-only: true
        # 배포(HTTPS)에서는 반드시 true. SameSite=none 을 쓰려면 secure=true 가 강제된다.
        secure: ${SESSION_COOKIE_SECURE:false}
        # 관리자 프론트와 API 서버의 사이트가 다르면(none), 같으면(lax).
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        path: /

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:info}

springdoc:
  # 관리자 API 목록은 공격자에게 좋은 지도가 된다. 운영에서는 꺼 두는 것을 권한다.
  #   SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  default-produces-media-type: application/json
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none

app:
  security:
    # 세션(쿠키) 인증은 CSRF에 노출되므로 기본값은 켜둔다.
    # 브라우저는 XSRF-TOKEN 쿠키를 받아 X-XSRF-TOKEN 헤더로 되돌려줘야 한다.
    # (axios는 withCredentials: true 만 켜면 자동으로 처리한다. README 참고)
    #
    # Swagger UI / curl 로 빠르게 확인할 때만 false 로 내린다. 운영에서는 반드시 true.
    csrf-enabled: ${CSRF_ENABLED:true}
    # 비밀번호 연속 실패 잠금 기준. 백엔드 app.auth.login-fail-max 와 같은 값을 쓴다.
    login-fail-max: ${LOGIN_FAIL_MAX:5}

  cors:
    # 관리자 프론트엔드 도메인. 세션 쿠키를 주고받으므로 와일드카드(*)는 쓸 수 없다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:17001,http://127.0.0.1:17001}

  bootstrap:
    admin:
      # 최초 관리자 계정(admin_user) 자동 생성.
      # 계정이 하나도 없을 때만 잠깐 켜고, 만들어지면 다시 끈다. (AdminAccountInitializer 주석 참고)
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

cloud:
  aws:
    s3:
      # 백엔드와 "같은" 버킷을 공유한다. 도메인 구분은 버킷이 아니라 object key prefix로 한다.
      bucket: ${S3_BUCKET:}
      # 응답 URL 루트. 비워두면 https://{bucket}.s3.{region}.amazonaws.com 으로 조합한다.
      cdn-url: ${S3_CDN_URL:}
      # 백엔드와 같은 값을 주입해야 백엔드가 올린 파일 key를 그대로 읽고 지울 수 있다.
      key-prefix: ${S3_KEY_PREFIX:}
    credentials:
      # 비우면 AWS 기본 자격증명 체인(EC2 IAM 역할)을 사용한다. EC2 배포에서는 비워두는 편이 안전하다.
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
